<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Shopaholic Store</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a class="logo" href="index.html">SHOPAHOLIC</a>
        <nav class="nav-links">
          <a href="index.html">Home</a><a href="products.html">Products</a
          ><a href="cart.html" class="cart-link">Cart <span data-cart-count hidden></span></a><a href="checkout.html">Checkout</a>
            
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
      </div>
    </header>
    <main class="section">
      <div class="container">
        <h1 class="section-title">Shopping Cart</h1>
        <div class="cart-layout">
          <div id="cart-list"></div>
          <aside class="summary">
            <h2>Order Summary</h2>
            <p>Total: <strong id="cart-total">$0</strong></p>
            <a class="button" href="checkout.html">Go to Checkout</a>
          </aside>
        </div>
      </div>
    </main>
    <footer class="footer">&copy; 2026 SHOPAHOLIC Store</footer>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
